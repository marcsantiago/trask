[package]
name = "trask"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
thiserror = "2"
tower-lsp = "0.20"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }

[[bin]]
name = "trask-lsp"
path = "src/bin/trask-lsp.rs"
